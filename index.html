<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云桌面 AI Agent「桌面记忆」方案 — 交互式演示</title>

  <!--
    HyperFrames standalone slideshow harness (0.8.41).
    Bundles are vendored locally under ./vendor — no CDN, fully offline.
  -->
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/hyperframes-player.global.js"></script>
  <script src="vendor/hyperframes-slideshow.global.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f7f9fc; }
    hyperframes-slideshow { background: #f7f9fc; }
  </style>
</head>
<body>
  <!--
    tabindex="0" is critical — <hyperframes-slideshow> binds keydown
    (ArrowLeft/Right, Space, Backspace) to itself. Without it, arrow keys are dead.
  -->
  <hyperframes-slideshow
    tabindex="0"
    notes-storage-key="agent-memory-deck"
    style="display: block; position: relative; width: 100vw; height: 100vh"
  >
    <hyperframes-player
      interactive
      style="position: absolute; inset: 0"
      src="composition/index.html"
    ></hyperframes-player>

    <!--
      DUPLICATED ISLAND — keep in sync with composition/index.html.
      <hyperframes-slideshow> reads the manifest from its own innerHTML.
    -->
    <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {
      "sceneId": "p1-cover",
      "notes": "开场：让云桌面里的 AI Agent 真正懂你。一句话点题：在 VDI 桌面启用桌面记忆，把 Agent 的上下文从对话框扩展到整个桌面。标语首尾呼应：不再抽卡、模糊指令可达成、数据属于企业。"
    },
    {
      "sceneId": "p2-problems",
      "notes": "两个典型问题（导图原文，含完整案例）。问题1：提示词很多但输出仍差——VDI 需求文档案例，Agent 回复四类缺陷；补充：企业上下文不等于个人上下文。问题2：模糊指令难达成——张三 PPT 案例，Agent 只能反问。详细案例可点右侧分支深入。",
      "fragments": [10.4, 10.8, 11.2, 11.6],
      "hotspots": [
        {
          "id": "h-cases",
          "label": "深入：两个案例逐条对照 →",
          "target": "case-detail",
          "region": { "x": 35, "y": 95.2, "w": 30, "h": 4.5 }
        }
      ]
    },
    {
      "sceneId": "p3-roots",
      "notes": "原因分析（导图原文）：问题1的根因——Agent 不了解当前这个用户，只能抽卡猜；问题2的根因——Agent 只记得对话框里的内容，桌面里做的事情一概不了解。关键对照：企业上下文≠个人上下文。",
      "fragments": [20.4, 20.8, 21.2]
    },
    {
      "sceneId": "p4-solution",
      "notes": "解决方案三步（导图原文）：①桌面记录——VDI 桌面启用桌面记忆，采集操作信息并记录；②形成记忆——数据可被用户的 Agent 调用，让 Agent 具备桌面中的记忆；③形成个人上下文——借助模型能力整理为用户上下文（岗位/工作边界/写作偏好），提升成功率。",
      "fragments": [30.4, 30.8, 31.2, 31.6]
    },
    {
      "sceneId": "p5-how",
      "notes": "怎么解决上述问题（导图原文）：问题1→Agent 回答成功率提升，桌面里所有 Agent 都了解用户是谁、工作边界和写作偏好，不再抽卡；问题2→Agent 具备和你一样的桌面记忆，模糊指令也可达成任务。呼应 P2 两个案例的改造后效果。",
      "fragments": [40.4, 40.8, 41.2, 41.6]
    },
    {
      "sceneId": "p6-custom",
      "notes": "更多自定义功能（导图原文）：支持用户对桌面记忆二次开发（使用自然语言即可），也可由管理员下发应用方式。举例：识别工作中可 AI 提效的点、生成日报/周报、生成待办事项等。",
      "fragments": [50.4, 50.8, 51.2]
    },
    {
      "sceneId": "p7-value",
      "notes": "用户价值总结（导图原文四条，第一条是重点）：①数据属于企业——新上/更换/多 Agent 并存都即刻获得个人上下文（更换 Agent 个人上下文不丢）；②提升 Agent 成功率；③模糊指令也可达成；④更多自定义功能。收尾：让云桌面里的每一个 AI Agent 都成为懂你的数字同事。",
      "fragments": [60.4, 60.8, 61.2, 61.6, 62.0]
    }
  ],
  "slideSequences": [
    {
      "id": "case-detail",
      "label": "两个案例逐条对照",
      "slides": [
        {
          "sceneId": "b-cases",
          "notes": "分支页：案例一（VDI 需求文档）与案例二（张三的 PPT）的「现在 vs 改造后」逐条对照。按上一步或 Esc 返回主线。"
        }
      ]
    }
  ]
}
    </script>
  </hyperframes-slideshow>
  <!-- The built-in slideshow nav capsule renders Present; no wrapper-level button. -->

  <script>
    // Hotspot bridge: the composition posts {source:"hf-deck-hotspot"} when a
    // branch card is clicked; here we drive the slideshow's public API.
    (function () {
      var slideEl = document.querySelector("hyperframes-slideshow");
      function enterBranch(seqId) {
        if (!slideEl) return;
        try {
          var c = slideEl.controller;
          if (c && typeof c.enterBranch === "function") {
            c.enterBranch(seqId);
          }
        } catch (e) {}
      }
      window.addEventListener("message", function (e) {
        var d = e.data;
        if (!d || d.source !== "hf-deck-hotspot" || !d.sequenceId) return;
        enterBranch(d.sequenceId);
      });
    })();
  </script>
</body>
</html>
